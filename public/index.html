<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Resume Analyzer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>AI Resume Analyzer</h1>
            <p>Analyze your resume and improve your ATS score</p>
        </header>


        <section class="upload-section">

            <h2>Upload Your Resume</h2>

            <input
                type="file"
                id="resumeInput"
                accept=".pdf"
            >
            <h2>Job Description</h2>

            <textarea
                id="jobDescription"
                placeholder="Paste the job description here..."
                rows="10"
            ></textarea>
            
            <button id="analyzeBtn">
                Analyze Resume
            </button>

            <p id="status"></p>

        </section>


        <section id="results" class="results hidden">

            <div class="score-card">

                <h2>ATS Score</h2>

                <div id="atsScore">
                    0
                </div>

            </div>


            <div class="score-grid">

                <div class="score-box">
                    <h3>Skills</h3>
                    <p id="skillScore">0</p>
                </div>

                <div class="score-box">
                    <h3>Sections</h3>
                    <p id="sectionScore">0</p>
                </div>

                <div class="score-box">
                    <h3>Keywords</h3>
                    <p id="keywordScore">0</p>
                </div>

                <div class="score-box">
                    <h3>Experience</h3>
                    <p id="experienceScore">0</p>
                </div>

                <div class="score-box">
                    <h3>Education</h3>
                    <p id="educationScore">0</p>
                </div>

                <div class="score-box">
                    <h3>Action Verbs</h3>
                    <p id="actionVerbScore">0</p>
                </div>

            </div>


            <div class="card">

                <h2>Skills Analysis</h2>

                <h3>Matched Skills</h3>
                <ul id="matchedSkills"></ul>

                <h3>Missing Skills</h3>
                <ul id="missingSkills"></ul>

            </div>


            <div class="card">

                <h2>Suggestions</h2>

                <ul id="suggestions"></ul>

            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>

</html>
